<!DOCTYPE html>
<html>
<head>
  <title>Report Missing Person</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 class="title">AI GARUDA</h1>
</header>

<div class="form-container">
  <h2>Report Missing Person</h2>

  <form id="reportForm">
    <input type="text" id="name" placeholder="Name" required>
    <input type="number" id="age" placeholder="Age" required>
    <input type="text" id="phone" placeholder="Family Mobile Number" required>
    <input type="text" id="last_seen" placeholder="Last Seen Location" required>
    <input type="text" id="address" placeholder="Home Address" required>
    
    <textarea id="description" placeholder="Description"></textarea>
    
    <input type="file" id="photo" required>

    <button type="submit">Submit</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="app.js"></script>

</body>
</html>
