<!DOCTYPE html>
<html>
<head>
    <title>Report</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2 class="logo">AI GARUDA</h2>
</header>

<div class="form-box">
    <h2>Report Missing Person</h2>

    <input id="name" placeholder="Name">
    <input id="age" placeholder="Age">
    <input id="mobile1" placeholder="Family Mobile">

    <input id="m_state" placeholder="State">
    <input id="m_district" placeholder="District">
    <input id="m_village" placeholder="Village">
    <input id="colony" placeholder="Colony / Address">

    <textarea id="description" placeholder="Description"></textarea>
    <input type="file" id="image">

    <button onclick="submitForm()">Submit</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="app.js"></script>

</body>
</html>
